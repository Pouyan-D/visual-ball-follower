ball_follower:
  ros__parameters:
    camera_topic: /camera/image_raw
    cmd_vel_topic: /cmd_vel
    enable_motion: false
    linear_speed: 0.08
    angular_gain: 0.004
    max_angular_speed: 1.0
    max_center_error_ratio_for_forward: 0.25
    frame_timeout_sec: 0.5
    lower_hsv: [6, 110, 110]
    upper_hsv: [25, 255, 255]
    min_area: 400.0
    min_radius: 15.0
    min_circularity: 0.6
    morphology_iterations: 3
